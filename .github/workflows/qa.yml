name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  finance-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[gui,iap]"
      - name: Seed deterministic PeopleSoft sample
        run: python scripts/seed_sample_data.py
      - name: Focused regressions
        run: python -m unittest discover -s tests -v
      - name: Financial smoke suite
        run: python scripts/smoke_test.py
      - name: MCP protocol probe
        run: python scripts/mcp_probe.py
