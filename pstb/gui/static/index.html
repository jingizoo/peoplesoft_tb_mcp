<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Workspace</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#11161d; --muted:#5d6b7a; --line:#e2e6ec;
  --accent:#1b6ef3; --accent-soft:#e8f0fe; --dr:#0f7b4f; --cr:#b23b3b;
  --warn:#b7791f; --warn-soft:#fdf6e7; --ok:#0f7b4f; --ok-soft:#e9f6ef;
  --bad:#b23b3b; --bad-soft:#fdecec; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1116; --panel:#161b23; --ink:#e8edf4; --muted:#93a1b3; --line:#252c37;
    --accent:#5c9dff; --accent-soft:#16233a; --dr:#4ade9b; --cr:#ff8b8b;
    --warn:#e0b050; --warn-soft:#2a2314; --ok:#4ade9b; --ok-soft:#12271d;
    --bad:#ff8b8b; --bad-soft:#2b1618; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";text-align:right;white-space:nowrap}
button,input,select{font:inherit;color:inherit}

/* layout */
.app{display:grid;grid-template-columns:1fr;height:100vh}
/* Ask is the product. The former browse navigation remains in the source only
   so its proven renderers can be reused for tool results generated in chat. */
nav{display:none}
.brand{font-weight:650;letter-spacing:-.01em;padding:4px 10px 14px;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;letter-spacing:0}
nav button{
  text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;
  color:var(--muted);cursor:pointer;font-weight:500;transition:background .12s,color .12s;
}
nav button:hover{background:var(--accent-soft);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navsep{margin:14px 10px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:650}
.hero{max-width:680px;margin:8vh auto 0;text-align:center;padding:0 20px}
.hero h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.hero p{color:var(--muted);margin:0 0 22px}
.hero .chips{justify-content:center;padding:0}
.navfoot{margin-top:auto;padding:10px;color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line)}
.navfoot b{color:var(--ink);font-weight:600}

main{overflow:hidden;display:flex;flex-direction:column}
.scope{
  position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)
}
.scope label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.scope select,.scope input{
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:88px;
  font-size:13px;font-weight:500
}
.scope input{min-width:120px}
.scope select:focus,.scope input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.spacer{flex:1}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}

.wrap{padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h2{margin:0;padding:13px 16px;font-size:13px;font-weight:650;letter-spacing:-.01em;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.pad{padding:16px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tile .v{font-size:21px;font-weight:650;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--muted);margin-top:3px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;top:0;background:var(--panel);text-align:left;padding:9px 12px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:650;border-bottom:1px solid var(--line);z-index:2
}
thead th.num{text-align:right}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
tfoot td{padding:11px 12px;font-weight:700;border-top:2px solid var(--line);background:var(--panel);
  position:sticky;bottom:0}
.tscroll{max-height:calc(100vh - 320px);overflow:auto;border-radius:0 0 var(--radius) var(--radius)}
.dr{color:var(--dr)} .cr{color:var(--cr)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:650;letter-spacing:.01em}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.dim{background:var(--bg);color:var(--muted)}

/* chat */
.chatwrap{display:grid;grid-template-rows:1fr auto auto auto;height:100vh}
.msgs{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(760px,92%);padding:11px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.fb{margin-top:8px;cursor:pointer;opacity:.45;font-size:13px;user-select:none;width:fit-content;
  background:none;border:0;color:inherit;padding:0}
.fb:hover{opacity:1}
.msg.bot .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:650;margin-bottom:6px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.trace{align-self:flex-start;font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.trace span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-family:ui-monospace,Menlo,monospace}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 18px;display:flex;gap:10px}
.composer input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.composer input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chat-context{display:flex;align-items:center;gap:8px;padding:8px 18px 0;background:var(--panel);
  color:var(--muted);font-size:11.5px;border-top:1px solid var(--line)}
.build-tag{margin-left:auto;color:var(--muted);font-size:11px;font-family:ui-monospace,monospace;cursor:help}
.scope-time{margin-right:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.tool-card{margin:6px 0}
.tool-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
  gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);font-size:13px;user-select:none}
.tool-card>summary::-webkit-details-marker{display:none}
.tool-card>summary .chev{transition:transform .15s;font-size:10px;color:var(--muted)}
.tool-card[open]>summary .chev{transform:rotate(90deg)}
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .35s ease}
#splash.done{opacity:0;pointer-events:none}
#splash .sb{fill:var(--accent);transform-box:fill-box;transform-origin:center bottom;
  animation:sgrow 1.1s ease-in-out infinite alternate}
#splash .b1{opacity:.30}#splash .b2{opacity:.55;animation-delay:.15s}#splash .b3{opacity:.40;animation-delay:.3s}
#splash .sl{stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:170;stroke-dashoffset:170;animation:sdraw 1.2s ease-out forwards .15s}
@keyframes sgrow{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
@keyframes sdraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  #splash .sb,#splash .sl{animation:none;stroke-dashoffset:0}
}
.tool-card>.inline{margin-top:6px}
.csvbtn{margin-left:auto;background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.csvbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.csvbtn:disabled{opacity:.7;cursor:default}
.fig{border-bottom:1px dashed var(--accent);cursor:pointer;font-variant-numeric:tabular-nums}
.fig:hover{background:var(--accent-soft)}
.trail{font-size:11px;color:var(--muted);margin:2px 0 8px}
.msg.bot .ans-h{font-weight:700;margin:8px 0 2px}
.msg.bot ul,.msg.bot ol{margin:4px 0 4px 20px;padding:0}
.msg.bot li{margin:2px 0}
.msg.bot code{background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:0 4px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.msg.bot .ans-gap{height:6px}
.tool-card.flash>summary{animation:cardflash 1.2s ease}
@keyframes cardflash{0%{background:var(--accent-soft)}100%{background:var(--bg)}}
.viz{margin:6px 0 2px}
.viz svg{display:block;width:100%;height:auto}
.viz .vleg{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 2px;font-size:12px;color:var(--ink)}
.viz .vleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.viz .sub{font-size:11px;color:var(--muted)}
.viz-tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);z-index:60;display:none}
.viz-tip .r{display:flex;gap:6px;align-items:center;white-space:nowrap;margin-top:2px}
.viz-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.scope-chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 10px;
  cursor:pointer;color:var(--ink);font-weight:600}
.scope-chip:hover{border-color:var(--accent);color:var(--accent)}
.scope-choice{display:grid;grid-template-columns:minmax(90px,1fr) minmax(90px,1fr) minmax(120px,1.4fr) auto;
  align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.scope-choice:last-child{border-bottom:0}
.scope-choice .scope-meta{font-size:11.5px;color:var(--muted)}
.scope-choice .btn{justify-self:end}
.step{align-self:stretch;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);
  padding:5px 2px;max-width:100%}
.step b{color:var(--ink);font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.step .args{font-family:ui-monospace,Menlo,monospace;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.step .ms{opacity:.7}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--bad)}
.inline{align-self:stretch;max-width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
.inline .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.msgs{max-width:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;
  font-size:12px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.rpt-sub td{font-weight:700;border-top:2px solid var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.16)}
.drawer.on{transform:none}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer header h3{margin:0;font-size:14px;font-weight:650}
.drawer .body{overflow:auto;flex:1}
.x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}

.empty{padding:44px 18px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .scope-choice{grid-template-columns:1fr 1fr}
  .scope-choice .scope-meta{grid-column:1/-1}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 120 84" width="132" height="92">
    <rect class="sb b1" x="10" y="24" width="18" height="50" rx="4"/>
    <rect class="sb b2" x="40" y="10" width="18" height="64" rx="4"/>
    <rect class="sb b3" x="70" y="34" width="18" height="40" rx="4"/>
    <path class="sl" d="M8 58 L49 26 L79 44 L112 12" fill="none"/>
  </svg>
</div>
<div class="app">
  <nav>
    <div class="brand">Finance Workspace<small id="brandsub">ledger &amp; subledger analytics</small></div>
    <button data-v="chat" class="on">Ask</button>
    <div class="navsep">Browse</div>
    <button data-v="tb">Trial balance</button>
    <button data-v="close">Close &amp; controls</button>
    <button data-v="rollup">Statement rollup</button>
    <button data-v="reports">Reports</button>
    <button data-v="ar">Receivables</button>
    <button data-v="compare">Variance</button>
    <button data-v="diag">Diagnostics</button>
    <div class="navfoot" id="navfoot"></div>
  </nav>

  <main>
    <div class="scope" id="scope">
      <label>Business unit<select id="f-bu"></select></label>
      <label>Ledger<select id="f-ledger"></select></label>
      <label>Fiscal year<input id="f-fy" type="number" step="1"></label>
      <label>Period<select id="f-per"></select></label>
      <label id="l-group">Group by<select id="f-group">
        <option value="">Account</option>
        <option value="DEPTID">Account + Department</option>
        <option value="PRODUCT">Account + Product</option>
        <option value="PROJECT_ID">Account + Project</option>
      </select></label>
      <label id="l-acct">Account filter<input id="f-acct" placeholder="6000-6999"></label>
      <label id="l-adj">Adjustments<select id="f-adj">
        <option value="false">Exclude</option><option value="true">Include</option>
      </select></label>
      <div class="spacer"></div>
      <button class="btn" id="go">Refresh</button>
      <button class="btn ghost" id="csv">Export CSV</button>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <header><h3 id="dtitle">Detail</h3><button class="x" id="dclose">&times;</button></header>
  <div class="body" id="dbody"></div>
</aside>

<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const money=v=>(v===null||v===undefined||v==='')?'':Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let META={}, VIEW='chat', LAST=null, CHAT_SCOPE=null, SCOPE_YEARS=[], CARDSEQ=0;
let SCOPE_YEARS_STALE=false;
function lazyLoadScopeYears(){
  if(!SCOPE_YEARS_STALE||!CHAT_SCOPE) return;
  SCOPE_YEARS_STALE=false;
  api('/api/scope?'+qs({business_unit:CHAT_SCOPE.business_unit,
    ledger:CHAT_SCOPE.ledger}))
    .then(d=>{if(d&&d.fiscal_years&&d.fiscal_years.length){
      SCOPE_YEARS=d.fiscal_years;
      if(SYNC_TIME_SELECTS) SYNC_TIME_SELECTS();
    }})
    .catch(()=>{SCOPE_YEARS_STALE=true;});
}
let BU_NAMES={};
let PENDING_TIME={}, SYNC_TIME_SELECTS=null;
let SCOPE_DISCOVERING=false, SCOPE_LOAD_ERROR='';
const makeSessionId=()=>{
  if(globalThis.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'chat-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
};
// A fresh page gets a fresh server-side history. Persisting only the session
// id across reloads would retain invisible model context after the messages
// themselves disappear from the page.
let CHAT_SESSION_ID=makeSessionId();
let CHAT_RESETTING=false;

const REQ_TIMEOUT_MS=180000;
async function api(path,opts){
  // A hung database query must surface as an error, not an endless spinner.
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),REQ_TIMEOUT_MS);
  let r;
  try{ r=await fetch(path,Object.assign({signal:ctl.signal},opts||{})); }
  catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError')
      throw new Error('Request timed out after '+(REQ_TIMEOUT_MS/1000)+'s. The database query '+
        'is still running or the scope is too broad — narrow the business unit, fiscal year, '+
        'period or account range.');
    throw e;
  }
  clearTimeout(timer);
  const j=await r.json().catch(()=>({detail:'bad response'}));
  if(!r.ok) throw new Error(j.detail||j.error||('HTTP '+r.status));
  return j;
}
const scope=()=>({bu:$('#f-bu').value,ledger:$('#f-ledger').value,fy:$('#f-fy').value||0,per:$('#f-per').value||0});
const qs=o=>Object.entries(o).filter(([,v])=>v!==''&&v!==undefined).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
const busy=m=>{$('#wrap').innerHTML='';$('#wrap').append(el('div','empty','<span class="spin"></span> '+m));};
const oops=m=>{$('#wrap').innerHTML='';$('#wrap').append(el('div','card','<div class="empty" style="color:var(--bad)">'+esc(m)+'</div>'));};
function rebuildPeriodOptions(maxRegular,selected){
  const per=$('#f-per');
  const maximum=Math.max(12,Number(maxRegular)||12);
  per.innerHTML='';
  for(let i=1;i<=maximum;i++) per.append(new Option('Period '+i,i));
  (META.defaults?.adjustment_periods||[]).forEach(a=>per.append(new Option('Adj '+a,a)));
  const wanted=Number(selected||0);
  if(wanted&&!Array.from(per.options).some(o=>Number(o.value)===wanted))
    per.append(new Option('Period '+wanted,wanted));
  if(wanted) per.value=String(wanted);
}

// A business unit code says nothing to a reader who does not already know the
// installation. The name is in the scope catalog, which lands after first
// paint, so it is recorded whenever a payload carries one and the chip is
// redrawn when it arrives.
function learnBuNames(list){
  let gained=false;
  (list||[]).forEach(o=>{
    const bu=o&&o.business_unit, name=(o&&o.descr||'').trim();
    // "(discovered)" is the placeholder /api/meta uses when it has a unit but
    // no description for it, and some sites' PS_BUS_UNIT_TBL_GL has no DESCR
    // column at all. Neither is a name — showing either is worse than the
    // bare code.
    if(!bu||!name||name==='(discovered)'||name===bu) return;
    if(BU_NAMES[bu]!==name){ BU_NAMES[bu]=name; gained=true; }
  });
  return gained;
}
function buName(bu){
  const n=BU_NAMES[bu];
  if(!n) return '';
  return n.length>28?(n.slice(0,27)+'…'):n;
}

function flattenScopes(scopes){
  return (scopes||[]).flatMap(s=>(s.ledgers||[]).map(l=>{
    const last=l.last_posted||{};
    return {
      business_unit:s.business_unit,descr:s.descr,base_currency:s.base_currency,
      ledger:l.ledger,fiscal_year:Number(last.fiscal_year||0),period:Number(last.period||0),
      fiscal_years:l.fiscal_years||[]
    };
  }));
}
function canonicalScope(value){
  if(!value||!value.business_unit||!value.ledger) return null;
  // null fiscal_year/period mean ANY — the question decides and each tool
  // uses its own current-period default. Business unit and ledger are the
  // only fields that must always be pinned.
  const num=v=>(v===null||v===undefined||v===''||v==='any')?null:(Number(v)||null);
  return {
    business_unit:String(value.business_unit),ledger:String(value.ledger),
    fiscal_year:num(value.fiscal_year),period:num(value.period)
  };
}
function scopeLabel(value){
  if(!value) return 'Choose financial scope';
  const fy=value.fiscal_year?('FY'+value.fiscal_year):'any year';
  const per=value.period?('P'+value.period):'any period';
  const name=buName(value.business_unit);
  const unit=value.business_unit+(name?(' '+name):'');
  return unit+' · '+value.ledger+' · '+fy+' · '+per;
}
function syncScopeControls(value){
  if(!value) return;
  const bu=$('#f-bu'),lg=$('#f-ledger'),fy=$('#f-fy'),per=$('#f-per');
  if(![...bu.options].some(o=>o.value===value.business_unit))
    bu.append(new Option(value.business_unit,value.business_unit));
  bu.value=value.business_unit;
  if(![...lg.options].some(o=>o.value===value.ledger))
    lg.append(new Option(value.ledger,value.ledger));
  if(![...per.options].some(o=>Number(o.value)===Number(value.period)))
    if(value.period) per.append(new Option('Period '+value.period,value.period));
  lg.value=value.ledger;
  if(fy) fy.value=value.fiscal_year||'';
  if(per) per.value=value.period||'';
}
function renderBuildTag(node){
  // Deployment identity, visible on every page. Most "the feature is
  // missing" reports on this project were a stale process, a ZIP copy
  // without git, or cached JavaScript — all invisible until now.
  // Accept the node directly: at construction time the context bar is
  // not in the document yet, so a querySelector finds nothing.
  const tag=node||document.querySelector('#build-tag'); if(!tag) return;
  const b=(META&&META.build)||{};
  const short=b.commit?(b.commit+(b.dirty?'+local':'')):('build '+(b.fingerprint||'?'));
  tag.textContent='v'+(b.version||'?')+' · '+short;
  tag.title=Object.entries(b).map(([k,v])=>k+': '+v).join('\n');
}
function applyScopeCatalog(){
  // Learn unit names HERE, because this is the one function both routes into
  // the catalog call. The background loader is skipped entirely when the
  // server's scope cache is already warm — /api/meta then carries the whole
  // catalog inline — so learning names only in that loader meant the very
  // situation a running server is normally in showed codes with no name.
  if(learnBuNames(META.financial_scopes)|learnBuNames(META.business_units))
    updateScopeChip();
  // Auto-select only when the database is unambiguous. With multiple choices
  // the conversation asks, rather than inheriting a sample BU.
  const opts=flattenScopes(META.financial_scopes||[]);
  if(opts.length===1&&!CHAT_SCOPE) setChatScope(opts[0],false);
  if(SYNC_TIME_SELECTS) SYNC_TIME_SELECTS();
  return opts;
}
async function loadScopesInBackground(){
  // The page is already usable: policy questions, the wiki and general chat
  // work with no scope at all. Discovery fills the bar in when it lands
  // instead of holding the first paint hostage to a WAN round trip.
  setScopeDiscovering(true);
  try{
    const d=await api('/api/scopes');
    META.financial_scopes=d.scopes||[];
    META.business_units=d.business_units||[];
    META.scopes_ready=true;
    const opts=applyScopeCatalog();   // learns the unit names on the way
    // A chooser already on screen was rendered empty — refresh it in place.
    if(!CHAT_SCOPE&&document.querySelector('#msgs .scope-chooser')&&opts.length)
      showScopeChooser();
  }catch(e){
    SCOPE_LOAD_ERROR=e.message||String(e);
  }finally{
    setScopeDiscovering(false);
  }
}
function setScopeDiscovering(active){
  SCOPE_DISCOVERING=active; updateScopeChip();
}
function updateScopeChip(){
  const chip=$('#active-scope');
  if(!chip) return;
  if(!CHAT_SCOPE&&SCOPE_DISCOVERING){ chip.textContent='Finding business units…'; return; }
  if(!CHAT_SCOPE&&SCOPE_LOAD_ERROR){ chip.textContent='Scope unavailable — retry'; return; }
  chip.textContent=scopeLabel(CHAT_SCOPE);
}
function setChatScope(value,announce){
  let next=canonicalScope(value);
  if(!next) return;
  // A year/period chosen before any business unit must not be discarded.
  if(!CHAT_SCOPE&&value&&value.__fromChooser&&Object.keys(PENDING_TIME).length)
    next=canonicalScope({...next,...PENDING_TIME});
  const changed=!CHAT_SCOPE||scopeLabel(CHAT_SCOPE)!==scopeLabel(next);
  CHAT_SCOPE=next; syncScopeControls(next); updateScopeChip();
  if(SYNC_TIME_SELECTS) SYNC_TIME_SELECTS();
  // The fiscal-year list costs MIN/MAX aggregates over PS_LEDGER — heavy on
  // a real instance — and at page load nobody has opened the year picker
  // yet. Fetch it LAZILY on first interaction with the selects instead of
  // eagerly on every scope set: page load issues zero PS_LEDGER aggregates.
  SCOPE_YEARS_STALE=true;
  if(announce&&changed&&$('#msgs')){
    $('#msgs').append(el('div','msg bot',
      '<div class="who">New database context</div>'+esc(scopeLabel(next))+
      '<br><span style="color:var(--muted)">Conversation history is isolated from every other scope.</span>'));
    $('#msgs').scrollTop=$('#msgs').scrollHeight;
  }
}
document.addEventListener('focusin',e=>{
  if(e.target&&(e.target.id==='f-fy'||e.target.id==='f-per'||
     e.target.id==='scope-fy'||e.target.id==='scope-per'))
    lazyLoadScopeYears();
});
function scopeYearOptions(){
  const found=(SCOPE_YEARS||[]).slice();
  (META.financial_scopes||[]).forEach(s=>(s.ledgers||[]).forEach(l=>
    (l.fiscal_years||[]).forEach(y=>{if(found.indexOf(y)<0)found.push(y);})));
  const cur=CHAT_SCOPE||{};
  if(cur.fiscal_year&&found.indexOf(cur.fiscal_year)<0) found.push(cur.fiscal_year);
  return found.sort((a,b)=>b-a);
}
function buildTimeSelects(){
  // Year and period are DEFAULTS for questions that do not name their own.
  // They live in the always-visible context bar: buried in the scope card
  // they were undiscoverable, and they silently did nothing before a scope
  // existed. PENDING_TIME remembers a choice made first and applies it the
  // moment a business unit is picked.
  const fySel=el('select','scope-time');
  fySel.id='scope-fy'; fySel.title='Fiscal year for questions that do not name one';
  const perSel=el('select','scope-time');
  perSel.id='scope-per'; perSel.title='Period for questions that do not name one';
  const fill=()=>{
    const cur=CHAT_SCOPE||PENDING_TIME||{};
    fySel.innerHTML='';perSel.innerHTML='';
    fySel.append(new Option('Any year',''));
    scopeYearOptions().forEach(y=>fySel.append(new Option('FY'+y,y)));
    perSel.append(new Option('Any period',''));
    for(let i=1;i<=13;i++) perSel.append(new Option('Period '+i,i));
    perSel.append(new Option('998 (adjustments)',998));
    fySel.value=cur.fiscal_year||'';perSel.value=cur.period||'';
  };
  fill();
  // Record ONLY the field the user actually touched: overlaying both meant
  // setting a period silently blanked the discovered fiscal year.
  const apply=()=>{
    if(CHAT_SCOPE) setChatScope({...CHAT_SCOPE,...PENDING_TIME},true);
    else updateScopeChip();
  };
  fySel.onchange=()=>{PENDING_TIME.fiscal_year=fySel.value||null;apply();};
  perSel.onchange=()=>{PENDING_TIME.period=perSel.value||null;apply();};
  SYNC_TIME_SELECTS=fill;
  return [fySel,perSel];
}
function renderScopeChooser(options,onChoose,title){
  const choices=(options||[]).map(o=>canonicalScope(o)?o:null).filter(Boolean);
  const c=el('div','card');
  c.append(el('h2',null,esc(title||'Choose a database scope')+
    '<span class="sub">'+choices.length+' BU / ledger combination'+(choices.length===1?'':'s')+'</span>'));
  if(!choices.length){
    c.append(el('div','empty','No financial scopes were returned by PS_LEDGER.'));
    return c;
  }
  const body=el('div');
  choices.forEach(o=>{
    const row=el('div','scope-choice');
    row.append(
      el('div','mono',esc(o.business_unit)),
      el('div',null,esc(o.ledger)),
      el('div','scope-meta',
        esc((o.descr||o.base_currency||'')+
          ((o.descr&&o.base_currency)?' · ':'')+(o.base_currency||''))+
        '<br>'+(Number(o.fiscal_year||0)&&Number(o.period||0)
          ?'Latest: FY'+Number(o.fiscal_year)+' P'+Number(o.period)
          :'Latest period loads when selected')),
    );
    const use=el('button','btn','Use this scope');
    use.onclick=async()=>{
      let chosen=o;
      if(!Number(o.fiscal_year||0)||!Number(o.period||0)){
        // Selecting a scope must be INSTANT. The latest-posted lookup is a
        // MIN/MAX aggregate over the balance table — the slow query class on
        // a real instance — and blocking the click on it turned "Use this
        // scope" into minutes of waiting and a Retry button. BU+ledger are
        // the only hard fields: set the scope NOW as "any year · any
        // period" (fully functional — every tool resolves the current
        // period itself) and let the detail arrive in the background,
        // updating the chip if it ever lands, silently not if it cannot.
        chosen={...o,fiscal_year:null,period:null};
        api('/api/scope?'+qs({business_unit:o.business_unit,
                              ledger:o.ledger}))
          .then(latest=>{if(latest&&Number(latest.fiscal_year||0))
            setChatScope({...o,...latest},false);})
          .catch(()=>{});
      }
      if(false){
        try{
          const latest=null;
          chosen={...o,...latest};
        }catch(e){
          use.disabled=false;use.textContent='Retry';
          return;
        }
      }
      setChatScope({...chosen,__fromChooser:true},true);
      if(onChoose) onChoose(canonicalScope(chosen));
    };
    row.append(use); body.append(row);
  });
  c.append(body);
  return c;
}
function dismissScopeChoosers(){
  document.querySelectorAll('#msgs .scope-chooser').forEach(h=>h.remove());
}
function showScopeChooser(){
  const msgs=$('#msgs'); if(!msgs) return;
  // At most ONE chooser card: clicking the chip repeatedly was stacking
  // identical cards, and a card picked in one copy left the others live.
  dismissScopeChoosers();
  const options=flattenScopes(META.financial_scopes||[]);
  const holder=el('div','inline scope-chooser');
  const chooser=renderScopeChooser(options,()=>dismissScopeChoosers(),'Choose active scope');
  holder.append(chooser);msgs.append(holder);msgs.scrollTop=msgs.scrollHeight;
}


/* ===== answer intelligence: markdown-lite + figure provenance =====
   The model's answer arrives as text; the FIGURES in it were verified
   against tool payloads by the number guard. These helpers surface that
   verification to the reader: light markdown so structure reads as
   structure, and every grounded number becomes a link that opens the
   exact source card it came from. All deterministic string work over
   ALREADY-ESCAPED text — the model cannot inject markup through it. */
function mdLite(escaped){
  const lines=String(escaped).split('\n');
  let out=[], list=null;
  const flush=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  for(const ln of lines){
    let m;
    if((m=ln.match(/^\s*[-*\u2022]\s+(.*)$/))){
      if(list!=='ul'){ flush(); out.push('<ul>'); list='ul'; }
      out.push('<li>'+m[1]+'</li>');
    } else if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(list!=='ol'){ flush(); out.push('<ol>'); list='ol'; }
      out.push('<li>'+m[1]+'</li>');
    } else if((m=ln.match(/^\s*#{1,3}\s+(.*)$/))){
      flush(); out.push('<div class="ans-h">'+m[1]+'</div>');
    } else if(!ln.trim()){
      flush(); out.push('<div class="ans-gap"></div>');
    } else { flush(); out.push('<div>'+ln+'</div>'); }
  }
  flush();
  return out.join('')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function figKey(n){
  return isFinite(n)?String(Math.round(n*100)/100):null;
}
function collectNums(o,set){
  if(typeof o==='number'){ set.add(o); }
  else if(Array.isArray(o)){ o.forEach(v=>collectNums(v,set)); }
  else if(o&&typeof o==='object'){ Object.values(o).forEach(v=>collectNums(v,set)); }
  else if(typeof o==='string'&&/^-?\d+(\.\d+)?$/.test(o)){ set.add(parseFloat(o)); }
}
function buildFigureIndex(cardMeta){
  // key -> {id, tool}; first source wins, incl. K/M/B restatement keys
  const map=new Map();
  for(const c of cardMeta){
    const nums=new Set(); collectNums(c.result,nums);
    for(const v of nums){
      const reg=k=>{ if(k!==null&&!map.has(k)) map.set(k,c); };
      reg(figKey(v));
      const a=Math.abs(v);
      [[1e3,'K'],[1e6,'M'],[1e9,'B']].forEach(([div,suf])=>{
        if(a>=div) [0,1,2].forEach(d=>{
          reg(String(Math.round(v/div*Math.pow(10,d))/Math.pow(10,d))+suf);
        });
      });
    }
  }
  return map;
}
function linkFigures(html,map){
  if(!map||!map.size) return html;
  return html.replace(
    /(^|[\s>({])(-?\d[\d,]*(?:\.\d+)?)\s?([KMBkmb]?)(?=[\s.,;:!?)%<}]|$)/g,
    (all,pre,num,suf)=>{
      const raw=parseFloat(num.replace(/,/g,''));
      if(!isFinite(raw)) return all;
      // plain small integers and years are periods/counts, not figures
      if(!suf&&!num.includes('.')&&!num.includes(',')&&Math.abs(raw)<1000) return all;
      if(!suf&&/^\d{4}$/.test(num)&&raw>=1990&&raw<=2100) return all;
      const key=suf?figKey(raw)+suf.toUpperCase():figKey(raw);
      const src=map.get(key);
      if(!src) return all;
      return pre+'<span class="fig" data-card="'+src.id+
        '" title="from '+esc(src.tool)+' \u2014 click to open the source">'+
        num+suf+'</span>';
    });
}

/* ===== full-data export =====
   The card shows a capped preview; the download re-runs the tool
   server-side at the export ceiling, so the file is the whole
   population rather than the page. */
function hasTable(r){
  if(Array.isArray(r)) return r.length>0&&r[0]&&typeof r[0]==='object';
  if(!r||typeof r!=='object') return false;
  if(r.pivot&&(r.pivot.rows||[]).length) return true;
  return Object.values(r).some(v=>Array.isArray(v)&&v.length>0&&
    v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)));
}
async function downloadExport(tool,args,result,btn){
  const label=btn.textContent;
  btn.textContent='exporting…'; btn.disabled=true;
  try{
    const r=await fetch('/api/export',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool:tool,args:args||{},result:result})});
    if(!r.ok){
      let detail=''; try{ detail=(await r.json()).detail||''; }catch(e2){}
      throw new Error(detail||('export failed (HTTP '+r.status+')'));
    }
    const blob=await r.blob();
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:(tool+'.csv');
    a.click(); URL.revokeObjectURL(a.href);
    const rows=r.headers.get('X-Export-Rows')||'?';
    const cut=r.headers.get('X-Export-Truncated')==='1';
    btn.textContent=(cut?'\u26a0 ':'\u2713 ')+rows+' rows';
    btn.title=r.headers.get('X-Export-Note')||'';
  }catch(e){
    btn.textContent='export failed';
    btn.title=e.message;
  }
  setTimeout(()=>{btn.textContent=label;btn.disabled=false;
    btn.title=CSV_HINT;},5000);
}
const CSV_HINT='Download the FULL result as CSV \u2014 re-run server-side, '+
  'beyond the rows shown here';
function csvButton(tool,args,result){
  const b=el('button','csvbtn','CSV');
  b.type='button'; b.title=CSV_HINT;
  b.setAttribute('aria-label','Download full '+tool+' result as CSV');
  b.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation();
    downloadExport(tool,args,result,b); };
  return b;
}

/* ===== charts — SVG built from verified payload values only =====
   No library, no CDN (the deployment box has no internet), and no model in
   the loop: every plotted number comes straight out of a tool payload, the
   same doctrine as the tables. Palette is fixed-order categorical, validated
   for CVD separation and contrast on both surfaces; the data table below
   each chart is the accessibility fallback for the low-contrast light
   slots. */
const VIZ_COLORS={light:['#2a78d6','#eb6834','#1baf7a','#eda100'],
                  dark:['#3987e5','#d95926','#199e70','#c98500']};
function vizPal(){
  return matchMedia('(prefers-color-scheme:dark)').matches
    ?VIZ_COLORS.dark:VIZ_COLORS.light;
}
let VIZ_TIP=null;
function vizTip(){
  if(!VIZ_TIP){VIZ_TIP=el('div','viz-tip');document.body.append(VIZ_TIP);}
  return VIZ_TIP;
}
function vizFmt(v){
  const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(a>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e4) return Math.round(v/1e3)+'K';
  return String(Math.round(v*100)/100);
}
function vizFull(v){
  return (v===null||v===undefined)?'—'
    :Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function vizTicks(lo,hi){
  const span=(hi-lo)||1, mag=Math.pow(10,Math.floor(Math.log10(span/4)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=4.5)||mag*10;
  const out=[];
  for(let v=Math.ceil(lo/step)*step; v<=hi+step/1e6; v+=step) out.push(v);
  return out;
}
function vizChart(spec){
  // spec: {type:'line'|'bar', x:[labels], series:[{name,values}], note?}
  const pal=vizPal(), n=spec.x.length;
  if(n<2||!spec.series.length) return null;
  const W=640,H=240,ML=56,MR=spec.type==='line'?116:16,MT=12,MB=26;
  const PW=W-ML-MR, PH=H-MT-MB;
  let lo=0,hi=0;
  spec.series.forEach(s=>s.values.forEach(v=>{
    if(v<lo)lo=v; if(v>hi)hi=v;}));
  if(lo===hi) hi=lo+1;
  const ticks=vizTicks(lo,hi);
  lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const Y=v=>MT+PH-(v-lo)/(hi-lo)*PH;
  const X=i=>ML+(n===1?PW/2:i*PW/(n-1));
  let g='';
  ticks.forEach(t=>{
    g+='<line x1="'+ML+'" x2="'+(W-MR)+'" y1="'+Y(t)+'" y2="'+Y(t)+
      '" style="stroke:var(--line);stroke-width:'+(t===0?1.5:1)+'"/>'+
      '<text x="'+(ML-7)+'" y="'+(Y(t)+3.5)+'" text-anchor="end" font-size="10.5"'+
      ' style="fill:var(--muted)" class="num">'+esc(vizFmt(t))+'</text>';
  });
  const step=Math.ceil(n/8); // x labels: at most ~8, never rotated
  spec.x.forEach((lb,i)=>{
    if(i%step&&i!==n-1) return;
    g+='<text x="'+X(spec.type==='bar'?i:i)+'" y="'+(H-8)+'" text-anchor="middle"'+
      ' font-size="10.5" style="fill:var(--muted)">'+esc(String(lb).slice(0,12))+'</text>';
  });
  if(spec.type==='line'){
    spec.series.forEach((s,si)=>{
      const pts=s.values.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
      g+='<polyline points="'+pts+'" fill="none" stroke="'+pal[si%pal.length]+
        '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // direct labels at line ends, ink-colored text with a series chip,
    // nudged apart so ≤4 labels never collide
    const ends=spec.series.map((s,si)=>({si,name:s.name,y:Y(s.values[n-1])}))
      .sort((a,b)=>a.y-b.y);
    ends.forEach((e2,i)=>{ if(i&&e2.y-ends[i-1].y<13) e2.y=ends[i-1].y+13; });
    ends.forEach(e2=>{
      g+='<circle cx="'+(W-MR+6)+'" cy="'+e2.y+'" r="3.5" fill="'+pal[e2.si%pal.length]+'"/>'+
        '<text x="'+(W-MR+13)+'" y="'+(e2.y+3.5)+'" font-size="11" style="fill:var(--ink)">'+
        esc(String(e2.name).slice(0,15))+'</text>';
    });
  } else {
    const vals=spec.series[0].values, band=PW/n,
      bw=Math.max(3,Math.min(band-4,46));
    vals.forEach((v,i)=>{
      const x=ML+i*band+(band-bw)/2, y0=Y(0), y1=Y(v),
        top=Math.min(y0,y1), h2=Math.max(1.5,Math.abs(y0-y1)),
        r=Math.min(4,bw/2,h2), up=v>=0;
      // rounded at the DATA end only, square at the baseline
      g+='<path data-i="'+i+'" d="M'+x+','+(up?top+h2:top)+
        (up?' V'+(top+r)+' Q'+x+','+top+' '+(x+r)+','+top+' H'+(x+bw-r)+
             ' Q'+(x+bw)+','+top+' '+(x+bw)+','+(top+r)+' V'+(top+h2)
           :' V'+(top+h2-r)+' Q'+x+','+(top+h2)+' '+(x+r)+','+(top+h2)+
             ' H'+(x+bw-r)+' Q'+(x+bw)+','+(top+h2)+' '+(x+bw)+','+(top+h2-r)+' V'+top)+
        ' Z" fill="'+pal[0]+'"/>';
      if(n<=6) g+='<text x="'+(x+bw/2)+'" y="'+(up?top-5:top+h2+11)+
        '" text-anchor="middle" font-size="10.5" style="fill:var(--ink)" class="num">'+
        esc(vizFmt(v))+'</text>';
    });
  }
  const box=el('div','viz');
  if(spec.series.length>1){
    const leg=el('div','vleg');
    leg.innerHTML=spec.series.map((s,si)=>'<span><i style="background:'+
      pal[si%pal.length]+'"></i>'+esc(String(s.name))+'</span>').join('');
    box.append(leg);
  }
  const holder=el('div');
  holder.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="chart">'+
    g+'<line class="vx" y1="'+MT+'" y2="'+(MT+PH)+
    '" style="stroke:var(--muted);stroke-width:1;display:none"/>'+
    '<g class="vdots"></g>'+
    '<rect x="'+ML+'" y="'+MT+'" width="'+PW+'" height="'+PH+'" fill="transparent"/></svg>';
  const svg=holder.firstChild;
  box.append(svg);
  if(spec.note) box.append(el('div','sub',esc(spec.note)));
  // hover layer: crosshair + tooltip on lines, per-bar tooltip on bars
  const tip=vizTip();
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect(), sx=W/rc.width;
    const px=(ev.clientX-rc.left)*sx;
    let i=spec.type==='line'
      ?Math.round((px-ML)/(PW/(n-1)))
      :Math.floor((px-ML)/(PW/n));
    if(i<0||i>=n){tip.style.display='none';return;}
    if(spec.type==='line'){
      const vx=svg.querySelector('.vx');
      vx.setAttribute('x1',X(i)); vx.setAttribute('x2',X(i));
      vx.style.display='';
      svg.querySelector('.vdots').innerHTML=spec.series.map((s,si)=>
        '<circle cx="'+X(i)+'" cy="'+Y(s.values[i])+'" r="4" fill="'+
        pal[si%pal.length]+'" style="stroke:var(--panel);stroke-width:2"/>').join('');
    }
    tip.innerHTML='<b>'+esc(String(spec.x[i]))+'</b>'+
      spec.series.map((s,si)=>'<div class="r"><i style="background:'+
        pal[si%pal.length]+'"></i>'+esc(String(s.name))+
        ' <span class="num">'+vizFull(s.values[i])+'</span></div>').join('');
    tip.style.display='block';
    tip.style.left=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8)+'px';
    tip.style.top=(ev.clientY+14)+'px';
  });
  svg.addEventListener('mouseleave',()=>{
    tip.style.display='none';
    const vx=svg.querySelector('.vx'); if(vx) vx.style.display='none';
    svg.querySelector('.vdots').innerHTML='';
  });
  return box;
}
function vizFromRows(rows){
  // Conservative trend detection over plain row sets: exactly one row per
  // time point, a recognizable time column, numeric measures. Anything
  // ambiguous stays a table — a wrong chart is worse than no chart.
  if(!Array.isArray(rows)||rows.length<3||rows.length>60) return null;
  const keys=Object.keys(rows[0]||{});
  const isNum=k=>rows.every(r=>r[k]===null||typeof r[k]==='number');
  const yearKey=keys.find(k=>/^(fiscal_year|year|fy)$/i.test(k)&&isNum(k)&&
    rows.every(r=>r[k]===null||(r[k]>=1990&&r[k]<=2100)));
  const perKey=keys.find(k=>/period/i.test(k)&&isNum(k)&&
    rows.every(r=>r[k]===null||(r[k]>=0&&r[k]<=998)));
  const dateKey=keys.find(k=>/(^|_)(dt|date|month)$/i.test(k)&&
    rows.every(r=>typeof r[k]==='string'));
  let xOf=null, timeKeys=[];
  if(yearKey&&perKey){ xOf=r=>r[yearKey]+'-P'+r[perKey]; timeKeys=[yearKey,perKey]; }
  else if(dateKey){ xOf=r=>String(r[dateKey]).slice(0,10); timeKeys=[dateKey]; }
  else if(yearKey){ xOf=r=>String(r[yearKey]); timeKeys=[yearKey]; }
  else if(perKey&&rows.length<=14){ xOf=r=>'P'+r[perKey]; timeKeys=[perKey]; }
  if(!xOf) return null;
  const sorted=[...rows].sort((a,b)=>{
    for(const k of timeKeys){
      const d=(typeof a[k]==='number')?a[k]-b[k]:String(a[k]).localeCompare(String(b[k]));
      if(d) return d;
    } return 0;
  });
  const xs=sorted.map(xOf);
  if(new Set(xs).size!==xs.length) return null;
  const measures=keys.filter(k=>!timeKeys.includes(k)&&isNum(k)&&
    sorted.some(r=>r[k]!==null));
  if(!measures.length) return null;
  // ONE axis, always. A count column next to an amount column differs by
  // orders of magnitude and would flatline at zero — drop it with a note
  // rather than fake a second y-scale.
  const mag=k=>Math.max(...sorted.map(r=>Math.abs(r[k]||0)));
  const top=Math.max(...measures.map(mag));
  const kept=measures.filter(k=>mag(k)>=top/100).slice(0,4);
  const skipped=measures.filter(k=>!kept.includes(k));
  if(!kept.length) return null;
  return vizChart({type:'line',x:xs,
    series:kept.map(k=>({name:k.replace(/_/g,' '),
      values:sorted.map(r=>r[k]===null?0:+r[k])})),
    note:'Plotted from the rows below.'+
      (skipped.length?' Not plotted (different scale, one axis only): '+
        skipped.map(k=>k.replace(/_/g,' ')).join(', ')+'.':'')});
}

function sparkline(pts){
  if(!pts||pts.length<2) return '';
  const vals=pts.map(p=>p.ending),mn=Math.min(...vals,0),mx=Math.max(...vals,0),rng=(mx-mn)||1;
  const W=680,H=110,step=W/Math.max(1,pts.length-1);
  const xy=pts.map((p,i)=>[i*step,H-((p.ending-mn)/rng)*H]);
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const zero=H-((0-mn)/rng)*H;
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:110px">'+
    '<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="var(--accent)" opacity=".12"/>'+
    (mn<0&&mx>0?'<line x1="0" y1="'+zero.toFixed(1)+'" x2="'+W+'" y2="'+zero.toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 3"/>':'')+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+
    xy.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--accent)"/>').join('')+'</svg>';
}

      (r.values||[]).map(v=>'<td class="num">'+(v?n(v):'—')+'</td>').join('')+
      '<td class="num"><b>'+n(r.total)+'</b></td>'+

  }).join('')+'</tbody>';

  if(p.truncation_note) notes.push(esc(p.truncation_note));
  c.append(el('div','pad sub',notes.join(' ')));
  return c;
}

function compactArgs(args){
  // Only arguments that were actually set: empty strings, zeros and false are
  // tool DEFAULTS, and printing them buried the values that mattered while
  // wrapping the trail. Full JSON remains on hover (title attribute).
  const parts=[];
  Object.entries(args||{}).forEach(([k,v])=>{
    if(v===''||v===0||v===false||v===null||v===undefined) return;
    let t=(typeof v==='string')?v:JSON.stringify(v);
    if(t.length>32) t=t.slice(0,32)+'\u2026';
    parts.push(k+'='+t);
  });
  let line=parts.join(', ');
  if(line.length>80) line=line.slice(0,80)+'\u2026';
  return line;
}
function renderToolResult(name,data,args){
  if(!data||typeof data!=='object') return null;

      el('div','pad',esc(data.error))); return c; }
  try{
    if(name==='get_trial_balance'){
      const filters=[];
      if(args&&args.account) filters.push('account '+args.account);
      if(args&&args.dept) filters.push('department '+args.dept);
      return renderTB(data,{
        compact:true,
        filtered:filters.length>0,
        filterLabel:filters.join(' · ')
      });
    }
    if(name==='tb_integrity_check') return renderIntegrity(data);
    if(name==='rollup_trial_balance') return renderRollup(data);
    if(name==='compare_trial_balance') return renderCompare(data);
    if(name==='get_account_balance') return renderAccount(data);
    if(name==='drill_to_journals') return renderJournals(data);
    if(name==='list_financial_scopes') return renderScopes(data);
    if(name==='run_report') return renderReport(data);
    if(name==='get_invoice_totals') return renderInvoiceTotals(data);
    if(name==='get_ar_aging') return renderAging(data);
    if(name==='get_customer_ar') return renderCustomerAR(data);
    if(name==='get_billing_workbench') return renderBilling(data);
    if(name==='wiki_lookup') return renderWikiPassages(data);
    if(name==='get_top_billing_customers') return renderTopBilling(data);
    if(name==='run_playbook') return renderPlaybook(data);
    if(name==='run_sql') return renderSql(data);
    if(name==='search_records') return renderRecords(data);
    if(name==='wiki_get_page'){const c=el('div','card');
      c.append(el('h2',null,esc(data.title||'Wiki page')+'<span class="sub">'+esc(data.id||'')+'</span>'));
      const b=el('div','pad');b.style.whiteSpace='pre-wrap';b.style.maxHeight='320px';b.style.overflow='auto';
      b.textContent=data.text||'';c.append(b);return c;}
    return renderGeneric(name,data);
  }catch(e){
    // A renderer bug must degrade to visible raw data, never a silently
    // missing dashboard.
    try{
      const c=el('div','card');
      c.append(el('h2',null,esc(name)+' <span class="badge warn">raw view</span>'+
        '<span class="sub">dashboard renderer hit an unexpected payload</span>'));
      c.append(renderGeneric(name,data)||el('div','pad','(no data)'));
      return c;
    }catch(_){ return null; }
  }
}

/* ---------- boot ---------- */
(async function(){
  try{ META=await api('/api/meta'); }catch(e){ oops('Cannot reach the server: '+e.message); return; }
  if(META.mcp_session&&!META.mcp_session.shared){
    // The engine fell back to one server per question. If the cause is
    // fatal (a database logon, a broken install) every question will fail
    // the same way — say WHY at the top of the page, not in a terminal
    // nobody is watching.
    const b=el('div','msg err');
    b.style.margin='10px 16px';
    b.innerHTML='<b>Chat engine degraded:</b> the shared answer server could not start, '+
      'so questions run slower and may fail.<br><span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">'+
      esc(META.mcp_session.error||'no detail captured')+'</span>';
    document.body.prepend(b);
  }
  renderBuildTag();   // META carries the build; the tag renders before this resolves
  const bu=$('#f-bu'), lg=$('#f-ledger'), per=$('#f-per');
  const sc0=META.scope||{};
  const bus=(META.business_units||[]).map(b=>b.business_unit);
  if(!bus.length) bus.push(sc0.business_unit||META.defaults.business_unit);
  bus.forEach(b=>bu.append(new Option(b,b)));
  bu.value=sc0.business_unit||META.defaults.business_unit;
  (sc0.ledgers&&sc0.ledgers.length?sc0.ledgers:[META.defaults.ledger])
    .forEach(l=>lg.append(new Option(l,l)));
  lg.value=sc0.ledger||META.defaults.ledger;
  rebuildPeriodOptions(sc0.max_regular_period,
    sc0.period||META.last_period_with_data||META.current.period);
  $('#f-fy').value=sc0.fiscal_year||META.current.fiscal_year;
  per.value=sc0.period||META.last_period_with_data||META.current.period;
  applyScopeCatalog();          // instant when the server cache was warm
  if(!META.scopes_ready) loadScopesInBackground();
  async function rescope(keepLedger){
    try{
      const d=await api('/api/scope?'+qs({business_unit:bu.value,
        ledger:keepLedger?lg.value:''}));
      const cur=lg.value; lg.innerHTML='';
      (d.ledgers.length?d.ledgers:[d.ledger]).forEach(l=>lg.append(new Option(l,l)));
      lg.value=d.ledgers.includes(cur)&&keepLedger?cur:d.ledger;
      if(d.fiscal_year){
        $('#f-fy').value=d.fiscal_year;
        rebuildPeriodOptions(d.max_regular_period,d.period);
      }
    }catch(e){ /* keep whatever is set */ }
  }
  bu.addEventListener('change',async()=>{await rescope(false); render();});
  lg.addEventListener('change',async()=>{await rescope(true); render();});
  $('#brandsub').textContent=META.defaults.business_unit+' · '+META.defaults.ledger;
  $('#navfoot').innerHTML=((META.scope&&META.scope.discovered)
    ?'<span style="color:var(--warn)">scope discovered from DB</span><br>':'')+
    '<b>'+esc(META.backend)+'</b> data'+(META.use_views?' (views)':'')+
    '<br><b>'+esc(META.llm.provider)+'</b> '+esc(META.llm.model)+
    '<br>wiki: <b>'+esc(META.wiki||'off')+'</b>'+
    (META.wiki_demo?' <span style="color:var(--warn)">(demo pages — not your wiki)</span>':'');
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('nav button[data-v]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); VIEW=b.dataset.v; render();
  });
  $('#go').onclick=render; $('#csv').onclick=exportCsv;
  ['f-fy','f-per','f-group','f-acct','f-adj'].forEach(id=>$('#'+id).onchange=render);
  $('#dclose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
  render();
  // Splash: a beat of motion while the first paint settles, never a wait —
  // the app is already interactive underneath; hard-remove keeps it from
  // ever masking the page if anything above threw.
  (function(){
    const sp=document.getElementById('splash');
    if(!sp) return;
    const done=()=>{ sp.classList.add('done'); setTimeout(()=>sp.remove(),400); };
    setTimeout(done, 900);
    window.addEventListener('error', done, {once:true});
  })();
})();

      '<path d="'+area+'" fill="var(--accent)" opacity=".12"/>'+
      (mn<0&&mx>0?'<line x1="0" y1="'+zero.toFixed(1)+'" x2="'+W+'" y2="'+zero.toFixed(1)+
        '" stroke="var(--line)" stroke-dasharray="3 3"/>':'')+
      '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+
      xy.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--accent)"/>').join('')+
      '</svg>';
  }
  const rows=pts.map(p=>'<tr><td>Period '+p.period+'</td><td class="num">'+money(p.activity)+
    '</td><td class="num">'+money(p.ending)+'</td></tr>').join('');
  let jhtml='<div class="empty">No posted journal lines for this period.</div>';
  if(j&&j.journal_lines?.length){
    jhtml='<div style="padding:0 16px 10px"><span class="badge '+(j.ties_to_ledger?'ok':'warn')+'">'+
      (j.ties_to_ledger?'Ties to ledger':'Does not tie')+'</span> <span style="color:var(--muted);font-size:12px">'+
      'journals '+money(j.journal_total)+' vs ledger '+money(j.ledger_activity)+'</span></div>'+
      '<table><thead><tr><th>Journal</th><th>Date</th><th>Source</th><th>Operator</th>'+
      '<th>Line description</th><th class="num">Amount</th></tr></thead><tbody>'+
      j.journal_lines.map(l=>'<tr><td class="mono">'+esc(l.journal_id)+'</td><td>'+esc(l.journal_date)+
        '</td><td>'+esc(l.source||'')+'</td><td>'+esc(l.oprid||'')+'</td><td>'+esc(l.line_descr||'')+
        '</td><td class="num '+(l.amount>=0?'dr':'cr')+'">'+money(l.amount)+'</td></tr>').join('')+
      '</tbody></table>';
  }
  $('#dbody').innerHTML=
    '<div class="pad"><div class="tiles">'+
      '<div class="tile"><div class="k">Beginning of year</div><div class="v">'+money(a.beginning_of_year)+'</div></div>'+
      '<div class="tile"><div class="k">Ending through P'+a.through_period+'</div><div class="v">'+money(a.ending_through_period)+'</div></div>'+
      '<div class="tile"><div class="k">Adjustments</div><div class="v">'+money(a.adjustment_period_amount)+
        '</div><div class="n">incl: '+money(a.ending_incl_adjustments)+'</div></div>'+
    '</div></div>'+
    (chart?'<div class="pad" style="padding-top:0">'+chart+'</div>':'')+
    '<h2 style="border-top:1px solid var(--line)">Monthly activity</h2>'+
    '<table><thead><tr><th>Period</th><th class="num">Activity</th><th class="num">Ending</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<h2 style="border-top:1px solid var(--line)">Journal detail — period '+scope().per+'</h2>'+jhtml;
}

/* ---------- chat ---------- */
function viewChat(){
  const w=$('#wrap'); w.style.padding='0'; w.innerHTML='';
  const wrap=el('div','chatwrap');
  const msgs=el('div','msgs'); msgs.id='msgs';
  msgs.setAttribute('role','log');
  msgs.setAttribute('aria-live','polite');
  msgs.setAttribute('aria-relevant','additions');
  const hero=el('div','hero');
  hero.innerHTML='<h1>Ask your finance data anything</h1>'+
    '<p>Ask in plain language. The agent queries the ledger first and dynamically builds the relevant '+
    'tables, controls, statements, customer views, and approved wiki evidence inside this conversation.</p>';
  msgs.append(hero);
  if(!CHAT_SCOPE){
    const holder=el('div','inline scope-chooser');
    holder.append(renderScopeChooser(
      flattenScopes(META.financial_scopes||[]),()=>dismissScopeChoosers(),
      'Choose a scope for financial questions'
    ));
    msgs.append(holder);
  }
  const chips=el('div','chips');
  ['What business units and ledgers exist?','Does the trial balance balance?','Why did travel expense change this period?',
   'Is the suspense balance within policy?','What is our capitalization threshold?','Run the income statement','Show the AR aging','Any invoices stuck in billing?','Top 20 billing customers in INR',
   'Are there unposted journals?'].forEach(q=>{
    const c=el('button','chip',esc(q)); c.type='button';
    c.onclick=()=>{$('#q').value=q;send();}; chips.append(c);
  });
  const context=el('div','chat-context','<span>Active data context</span>');
  const contextButton=el('button','scope-chip',esc(scopeLabel(CHAT_SCOPE)));
  contextButton.id='active-scope';
  contextButton.onclick=()=>{
    if(SCOPE_LOAD_ERROR){SCOPE_LOAD_ERROR='';loadScopesInBackground();return;}
    showScopeChooser();
  };context.append(contextButton);
  buildTimeSelects().forEach(sel=>context.append(sel));
  const build=el('span','build-tag');
  build.id='build-tag';
  context.append(build);
  renderBuildTag(build);
  const comp=el('div','composer');
  comp.innerHTML='<input id="q" aria-label="Ask a question about your finance data" '+
    'placeholder="Ask a question…" autocomplete="off">'+
    '<button class="btn" id="send">Send</button><button class="btn ghost" id="clr">Clear</button>';
  wrap.append(msgs,chips,context,comp);
  w.append(wrap);
  $('#send').onclick=send; $('#clr').onclick=async()=>{
    if(CHAT_RESETTING) return;
    CHAT_RESETTING=true;
    const oldSessionId=CHAT_SESSION_ID;
    // Detach the browser from the old provider history immediately. Disabling
    // the composer prevents a new turn from becoming invisible while the
    // server waits for any in-flight old turn to finish resetting.
    CHAT_SESSION_ID=makeSessionId();
    const q=$('#q'), sendButton=$('#send'), clearButton=$('#clr');
    q.disabled=true;sendButton.disabled=true;clearButton.disabled=true;
    msgs.innerHTML='';msgs.append(el('div','empty','Clearing history…'));
    try{
      await api('/api/chat/reset',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session_id:oldSessionId})
      });
      msgs.innerHTML='';msgs.append(el('div','empty','History cleared. Ask a new question.'));
    }catch(e){
      msgs.innerHTML='';msgs.append(el('div','msg err',
        esc('A new chat was started, but old history cleanup failed: '+e.message)));
    }finally{
      CHAT_RESETTING=false;
      q.disabled=false;sendButton.disabled=false;clearButton.disabled=false;q.focus();
    }
  };
  $('#q').onkeydown=e=>{if(e.key==='Enter')send()};
  $('#q').focus();
}
async function send(messageOverride,appendUser){
  const sendSession=CHAT_SESSION_ID; // stale-answer guard after Clear
  if(CHAT_RESETTING) return;
  const i=$('#q');
  const supplied=typeof messageOverride==='string';
  const m=supplied?messageOverride.trim():i.value.trim();
  if(!m) return;
  if(appendUser===undefined) appendUser=true;
  const msgs=$('#msgs'); if(msgs.querySelector('.empty')) msgs.innerHTML='';
  i.value=''; if(appendUser) msgs.append(el('div','msg me',esc(m)));
  const think=el('div','msg bot','<span class="spin"></span> Working…');
  msgs.append(think); msgs.scrollTop=msgs.scrollHeight;
  // While the one-shot request runs, poll what the turn is DOING so a
  // 40-second query reads as "running get_trial_balance — 38s", not a
  // spinner asking for faith.
  const tStart=Date.now();
  const poll=setInterval(async()=>{
    try{
      const a=await (await fetch('/api/activity?session_id='+
        encodeURIComponent(CHAT_SESSION_ID))).json();
      const ev=a.events||[];
      const running=[...ev].reverse().find(e=>e.status==='running');
      const done=ev.filter(e=>e.status==='done').length;
      const secs=Math.round((Date.now()-tStart)/1000);
      let line='Working… '+secs+'s';
      if(running) line='<b>'+esc(running.tool)+'</b> '+esc(running.args||'')+
        ' — running, '+secs+'s'+(done?' · '+done+' step'+(done===1?'':'s')+' done':'');
      else if(done) line='thinking over '+done+' result'+(done===1?'':'s')+'… '+secs+'s';
      think.innerHTML='<span class="spin"></span> '+line;
    }catch(e){}
  },700);
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),REQ_TIMEOUT_MS);
    let r;
    try{
      r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          message:m,session_id:CHAT_SESSION_ID,scope:CHAT_SCOPE||{}
        }),signal:ctl.signal});
    } finally { clearTimeout(timer); }
    const j=await r.json();
    clearInterval(poll);
    think.remove();
    if(sendSession!==CHAT_SESSION_ID) return; // cleared mid-flight — stale answer
    if(j.scope_required){
      const holder=el('div','inline scope-chooser');
      holder.append(renderScopeChooser(j.scope_options||[],()=>{
        dismissScopeChoosers();send(m,false);
      },j.answer||'Choose a scope'));
      msgs.append(holder);msgs.scrollTop=msgs.scrollHeight;
      return;
    }
    if(j.scope) setChatScope(j.scope,false);
    const wantChart=/\b(chart|graph|plot|trend|visuali[sz]e)/i.test(m);
    const turnCards=[], turnCardMeta=[];
    (j.tool_calls||[]).forEach(c=>{
      // Everything arrives WITH the answer, so the sources render COLLAPSED:
      // the reply is what the user came for, and each card is one click away
      // behind a header that already says tool, args, status and duration.
      const card=document.createElement('details');
      card.className='tool-card';
      const summary=document.createElement('summary');
      summary.innerHTML='<span class="chev">\u25B6</span>'+
        '<span class="dot '+(c.ok===false?'bad':'ok')+'"></span><b>'+esc(c.tool)+'</b>'+
        '<span class="args" title="'+esc(JSON.stringify(c.args||{}))+'">'+esc(compactArgs(c.args))+'</span>'+
        '<span class="ms">'+(c.ms!==undefined?c.ms+' ms':'')+'</span>';
      if(c.ok!==false&&hasTable(c.result))
        summary.append(csvButton(c.tool,c.args||{},c.result));
      card.append(summary);
      card.id='src-'+(++CARDSEQ);
      const node=renderToolResult(c.tool,c.result,c.args||{});
      if(node){ const holder=el('div','inline'); holder.append(node); card.append(holder); }
      else card.className='tool-card no-body';
      msgs.append(card);
      turnCards.push(card);
      if(c.ok!==false) turnCardMeta.push({id:card.id,tool:c.tool,result:c.result});
    });
    if(wantChart){
      // The user asked to SEE it — open the first card that drew a chart
      // instead of leaving it behind a collapsed header.
      const cc=turnCards.find(cd=>cd.querySelector('.viz'));
      if(cc) cc.open=true;
    }
    if(!r.ok||j.error) msgs.append(el('div','msg err',esc(j.error||j.detail||'Request failed')));
    else if(j.answer){
      const b=el('div','msg bot');
      const totalMs=(j.tool_calls||[]).reduce((a,c)=>a+(c.ms||0),0);
      const trail=turnCardMeta.length
        ? '<div class="trail">Answered from '+turnCardMeta.length+' verified source'+
          (turnCardMeta.length===1?'':'s')+
          (totalMs?' in '+(totalMs>=1000?(totalMs/1000).toFixed(1)+'s':totalMs+' ms'):'')+
          ' \u2014 underlined figures open their source.</div>' : '';
      b.innerHTML='<div class="who">Assistant commentary — cards above are verified source results</div>'+trail+
        linkFigures(mdLite(esc(j.answer)),buildFigureIndex(turnCardMeta))+
        (j.turn_id?'<button class="fb" type="button" data-turn="'+esc(j.turn_id)+
          '" aria-label="Flag this answer as wrong or unhelpful">&#128078;</button>':'');
      const fb=b.querySelector('.fb');
      if(fb) fb.onclick=async()=>{ fb.textContent='logged \u2713'; fb.style.pointerEvents='none';
        try{ await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({turn_id:fb.dataset.turn,verdict:'bad'})}); }catch(e){} };
      msgs.append(b);
    }
  }catch(e){
    clearInterval(poll);
    think.remove();
    const m2=e.name==='AbortError'
      ? 'Timed out after '+(REQ_TIMEOUT_MS/1000)+'s. The tool call is still running against the '+
        'database — narrow the scope, or raise db.query_timeout_seconds.'
      : e.message;
    msgs.append(el('div','msg err',esc(m2)));
  }
  msgs.scrollTop=msgs.scrollHeight;
}

/* ---------- csv ---------- */
function exportCsv(){
  if(!LAST||!LAST.rows?.length) return;
  const extras=(LAST.group_by||[]).filter(g=>g!=='ACCOUNT').map(e=>e.toLowerCase());
  const head=['account',...extras,'descr','type','beginning','period_activity','ending_dr','ending_cr'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[head.join(',')].concat(LAST.rows.map(r=>head.map(h=>q(r[h])).join(',')));
  lines.push(head.map(h=>q(({account:'TOTAL',beginning:LAST.totals.beginning,
    period_activity:LAST.totals.period_activity,ending_dr:LAST.totals.ending_dr,
    ending_cr:LAST.totals.ending_cr})[h]??'')).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download='trial_balance_'+LAST.business_unit+'_FY'+LAST.fiscal_year+'_P'+LAST.period+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}
