# PeopleSoft TB agent configuration.
# Secrets (DB passwords, API tokens, GCP project) live in .env — see .env.example.

defaults:
  business_unit: US001
  ledger: ACTUALS
  setid: SHARE            # SETID for chartfield tables when SET_CNTRL lookup is unavailable
  calendar_id: "01"       # detail calendar used to resolve dates -> fiscal year/period
  base_currency: USD
  rate_type: CRRNT        # PS_RT_RATE_TBL rate type for FX lookups
  adjustment_periods: [998]
  suspense_accounts: ["1999"]
  retained_earnings_account: "3500"
  account_tree: ACCOUNT   # default PSTREE name for rollups
  ar_control_accounts: ["1100"]   # GL account(s) the AR subledger must tie to
  aging_buckets: [30, 60, 90]     # aging day edges -> current, 1-30, 31-60, 61-90, over_90

db:
  backend: sqlite         # sqlite | oracle | sqlserver
  sqlite_path: sample_data/ps_sample.db
  schema: ""              # e.g. SYSADM when querying the PS schema from another user
  use_views: false        # set true once sql/oracle/XX_TB_*.sql views are deployed
  query_timeout_seconds: 120   # abort a query rather than hanging the UI        # set true once sql/oracle/XX_TB_*.sql views are deployed

# Concept overrides: which codes define a named population at THIS site.
# Approved site-memory facts outrank this; the built-in seed backstops both.
# semantics:
#   billing_invoiced:
#     values: [INV, PRO]

# PeopleSoft Query Access Service. Discovery of existing queries needs
# NOTHING here — it is plain SQL on the query catalog. These settings are
# only for EXECUTING a query, which runs as this PeopleSoft user, so
# results respect that user's permission lists. Credentials come from
# .env (PSFT_QAS_USER / PSFT_QAS_PASSWORD), never from this file.
# Executing an existing PSQuery via the Query Access Service. DISCOVERY
# (search_ps_queries / describe_ps_query) is plain SQL and needs none of
# this; only execution does. Credentials live in .env, never here:
# PSFT_QAS_USER, PSFT_QAS_PASSWORD, and PSFT_QAS_NODE if your site's IB
# node is not PSFT_FS. Check it with scripts/diagnose_psquery.py — until
# every precondition is met, run_ps_query answers from bundled FIXTURES
# and says mode: fixtures in the payload.
ps_api:
  enabled: false
  target_location: ""       # blank = discover from the site's PSIBSVCSETUP
  timeout_seconds: 60
  max_rows: 5000

llm:
  provider: ollama        # ollama | gemini | claude  (override per run: --provider, or PSTB_LLM_PROVIDER)
  ollama_host: http://localhost:11434
  ollama_model: llama3.1:8b
  gemini_model: gemini-2.5-pro    # gemini-2.5-flash is cheaper/faster, weaker chaining
  gemini_location: us-central1
  gemini_thinking_budget: -1      # -1 model default; >0 caps thinking tokens (latency/cost)
  ollama_num_ctx: 16384         # see docs/CONTEXT_BUDGET.md — the fixed prompt
  temperature: 0.2
  gemini_force_tool_round: true   # force a tool call on tool-needing questions
  gemini_routing_temperature: 0.0 # greedy decoding for tool selection
  # Claude on the Anthropic API. The key is NEVER here — it lives in .env as
  # ANTHROPIC_API_KEY (the console writes it), or comes from a signed-in
  # `ant auth login` profile, and the SDK reads it directly.
  claude_model: claude-opus-5
  claude_max_tokens: 32000        # thinking and answer share this budget
  claude_effort: high             # low | medium | high | xhigh | max
  claude_force_tool_round: true   # Claude rejects temperature; this is the
                                  # only routing lever the API offers
  claude_fallbacks: true          # retry a safety refusal on the recommended
                                  # substitute model rather than answering nothing
  max_tool_result_chars: 0        # 0 = auto (24k local models, 120k gemini/claude)

wiki:
  provider: auto          # confluence | localdocs | auto (confluence when configured, else local docs)
  localdocs_path: sample_wiki
  confluence_space: ""    # optional space key filter, e.g. FIN
  confluence_labels: ""   # optional label filter, e.g. "gl-policy,gl-close,gl-coa"

tools:
  allow_raw_sql: true     # guarded SELECT-only run_sql/list_tables/describe_table tools
  max_rows: 200           # cap on rows returned to the LLM
  reports_path: reports   # folder of nVision-style report definitions (JSON)
  question_log: logs/questions.jsonl   # every chat turn + failure flags ("" disables)
  txn_row_threshold: 1000 # a TRANSACTION table under this row count is flagged
                          # as probably-not-the-active-table; reference tables
                          # are never flagged (small is normal for them)
  sample_rows: 3          # rows returned by profile_record / compare_records.
                          # These reach the configured model, and on the Gemini
                          # provider that means they leave your network.
                          # Personal columns (names, addresses, tax and bank
                          # identifiers) are MASKED first; identifiers, codes,
                          # dates and amounts are not. Set to 0 to send no rows
                          # at all — shape, fill rates and status-code counts
                          # still come back, so record selection keeps working.
