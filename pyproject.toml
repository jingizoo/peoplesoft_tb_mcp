[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplesoft-tb-mcp"
version = "0.1.0"
description = "MCP server + LLM chat client for querying a PeopleSoft trial balance (Ollama, Gemini on Vertex AI, or Claude)"
requires-python = ">=3.10"
# Upper bounds are deliberate. The MCP SDK renamed tool/result fields between
# 1.x and 2.x; the code handles both, but an unbounded install would silently
# adopt the next breaking major. Verified against mcp 2.0, google-genai 2.14,
# ollama 0.6 on Python 3.10-3.14. Raise a bound only after running
# scripts/smoke_test.py and scripts/mcp_probe.py.
dependencies = [
    "mcp>=1.2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
llm = [
    "ollama>=0.4.7,<1.0",
    "google-genai>=1.16.0,<3.0",
    # 0.121 is what the Claude provider was written and tested against.
    # The floor matters: output_config.effort, adaptive thinking and the
    # fallbacks parameter are all newer than the 0.x series suggests.
    "anthropic>=0.121.0,<1.0",
]
gui = [
    # 0.140 enforces request Content-Type, which is what stops a
    # cross-origin page POSTing JSON to a local endpoint.
    "fastapi>=0.140,<1.0",
    "uvicorn>=0.27,<1.0",
]
oracle = ["oracledb>=2.4,<4.0"]
# Verifying the identity-aware front end's signed assertions
# (PSTB_TRUSTED_IAP). [crypto] carries the ES256 backend; the llm extra
# happens to pull google-auth transitively, but a security feature does
# not lean on a coincidence of someone else's dependency tree.
iap = ["google-auth[crypto]>=2.35,<3.0"]
# The BigQuery silo backend. google-cloud-bigquery-storage is
# deliberately NOT included: when importable, the DB-API shim silently
# switches to a second, differently-billed result-fetch path this
# release has not tested -- CI asserts its absence.
bigquery = ["google-cloud-bigquery>=3.25,<4.0"]
sqlserver = ["pyodbc>=5.1,<6.0"]

[project.scripts]
pstb-mcp-http = "pstb.mcp_http:main"
pstb-server = "pstb.server:main"
pstb-chat = "pstb.client.chat:main"
pstb-gui = "pstb.gui.app:main"

[tool.setuptools.packages.find]
include = ["pstb*"]

[tool.setuptools.package-data]
"pstb.gui" = ["static/*"]
