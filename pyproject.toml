[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplesoft-tb-mcp"
version = "0.1.0"
description = "MCP server + LLM chat client for querying a PeopleSoft trial balance (Ollama or Gemini on Vertex AI)"
requires-python = ">=3.10"
# Upper bounds are deliberate. The MCP SDK renamed tool/result fields between
# 1.x and 2.x; the code handles both, but an unbounded install would silently
# adopt the next breaking major. Verified against mcp 2.0, google-genai 2.14,
# ollama 0.6 on Python 3.10-3.14. Raise a bound only after running
# scripts/smoke_test.py and scripts/mcp_probe.py.
dependencies = [
    "mcp>=1.2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
llm = [
    "ollama>=0.4.7,<1.0",
    "google-genai>=1.16.0,<3.0",
]
gui = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]
oracle = ["oracledb>=2.4,<4.0"]
sqlserver = ["pyodbc>=5.1,<6.0"]

[project.scripts]
pstb-server = "pstb.server:main"
pstb-chat = "pstb.client.chat:main"
pstb-gui = "pstb.gui.app:main"
pstb-migrate-server = "pstb.migrate.server:main"

[tool.setuptools.packages.find]
include = ["pstb*"]

[tool.setuptools.package-data]
"pstb.gui" = ["static/*"]
